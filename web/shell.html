<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TINY2D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            image-rendering: pixelated;
            display: block;
            cursor: none;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
        }
        #status.hidden {
            display: none;
        }
        #status.error {
            color: #ff6b6b;
            max-width: 80%;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div id="status">Loading...</div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        var Module = {
            noInitialRun: true,
            canvas: (function() { return document.getElementById('canvas'); })(),
            onRuntimeInitialized: async function() {
                await loadDataZip();
                document.getElementById('status').classList.add('hidden');
                Module.callMain();
            }
        };

        function setStatus(text, isError) {
            const el = document.getElementById('status');
            el.textContent = text;
            if (isError) el.classList.add('error');
        }

        async function loadDataZip() {
            try {
                setStatus('Fetching data.zip...');
                const resp = await fetch('data.zip');
                if (!resp.ok) {
                    setStatus('data.zip not found. Place data.zip next to tiny2d.html.', true);
                    return;
                }

                const buf = await resp.arrayBuffer();
                setStatus('Unpacking...');

                const zip = await JSZip.loadAsync(buf);

                const entries = Object.entries(zip.files);
                let loaded = 0;

                for (const [path, file] of entries) {
                    if (file.dir) continue;

                    const content = await file.async('uint8array');

                    // Поддержка обоих вариантов zip:
                    // 1. data/scripts/main.lua  (зазипована папка data)
                    // 2. scripts/main.lua       (зазиповано содержимое data)
                    const cleanPath = path.startsWith('data/')
                        ? path.substring(5)
                        : path;

                    const fullPath = '/data/' + cleanPath;
                    const dir = fullPath.substring(0, fullPath.lastIndexOf('/'));

                    try {
                        FS.mkdirTree(dir);
                    } catch (e) {
                        // папка уже есть — ок
                    }

                    FS.writeFile(fullPath, content);
                    loaded++;
                    setStatus(`Unpacking... ${loaded}/${entries.length}`);
                }

                console.log('[tiny2d] extracted', loaded, 'files');
            } catch (e) {
                console.error('[tiny2d] zip error:', e);
                setStatus('Failed to load data.zip: ' + e.message, true);
            }
        }
    </script>
    {{{ SCRIPT }}}
</body>
</html>
